# 출시 — 공개 거울 developedby-dev/server-php (ADR-0050). 원천은 모노레포 sdks/php/.github/workflows/release.yml — 거울에서 고치지 않는다.
# PHP 꾸러미 — Packagist는 이 저장소의 GitHub 웹훅으로 태그를 받는다(업로드 없음). 레지스트리 업로드가 없는 대신, 판 태그를 밀면 환경 release에서 대표가 승인한 뒤 태그의 소스 묶음을
# GitHub 출시물(SHA256SUMS · GitHub 증명)로 올린다 — 받은 코드가 이 태그와 같은지 확인할 수 있게. 순서는 모노레포 docs/runbooks/sdk-release.md
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 태그와 꾸러미 판이 같은지 · 소스 묶음
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          grep -q "public const SDK = '${VERSION}'" src/Version.php
          name="server-php-${VERSION}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: server-php-*.tar.gz
      - name: 출시물
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "server-php ${TAG}" server-php-*.tar.gz SHA256SUMS
